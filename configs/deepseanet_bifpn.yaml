# Ablation baseline: identical to deepseanet_biskfpn but with the stock BiFPN
# neck. Run both with the same seed to isolate the neck's contribution.
name: deepseanet-bifpn
model: deepseanet
neck: bifpn
phi: 0
num_classes: 6
image_size: 512

epochs: 350
batch_size: 64
optimizer: sgd
learning_rate: 0.01
weight_decay: 0.0005
alpha: 50.0
beta: 1.0

seed: 0
adversarial: false

data_root: data/brackish
split: grouped
