# Settings the committed YOLOv8 run actually used (results/yolov8s/args.yaml).
# Note the epoch count: 100, not the 350 reported in the paper's Table 4.
name: yolov8s
model: yolov8s.pt
imgsz: 800
epochs: 100
batch: 16
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.001
warmup_epochs: 3.0
box: 7.5
cls: 0.5
dfl: 1.5
patience: 50
seed: 0
