name: Bug report
description: Something in the code or the notebooks does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest command or snippet that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show deepseanet | head -2` and `python --version`.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: python
